<!DOCTYPE html>
<html>
<head>
<title>Simple Flow</title>

<style>
body{
  margin:0;
  text-align:center;
  font-family:Arial;
}

.page{
  display:none;
}

img{
  width:100%;
  max-height:90vh;
  object-fit:cover;
}

.link{
  font-size:28px;
  cursor:pointer;
  margin-top:40px;
  display:inline-block;
}

.td{
  font-size:28px;
  cursor:pointer;
  margin:15px;
}
</style>

</head>
<body>

<!-- PAGE 1 -->
<div id="page1" class="page" style="display:block;">
  <div class="link" onclick="showPage('page2')">OPEN</div>
</div>


<!-- PAGE 2 -->
<div id="page2" class="page">
  <img src="TAJ.jpeg">
  <br>
  <div class="td" onclick="showPage('page3')">TD</div>
</div>


<!-- PAGE 3 -->
<div id="page3" class="page">
</div>


<script>

function showPage(pageId){

  document.getElementById("page1").style.display="none";
  document.getElementById("page2").style.display="none";
  document.getElementById("page3").style.display="none";

  document.getElementById(pageId).style.display="block";
}

</script>

</body>
</html>
